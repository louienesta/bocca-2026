[build]
  base = "bocca-platform"
  command = "node scripts/check-deploy-env.mjs && pnpm --filter @bocca/web check && pnpm --filter @bocca/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22.23.3"

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
